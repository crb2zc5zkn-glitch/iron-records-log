<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Iron Records Log</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="description" content="Personal 12-week training log: plan, log sets, track progress.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#F1F4F1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#090D0E" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Iron Records Log">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
@font-face{font-family:"Barlow Condensed"; font-style:normal; font-weight:600; font-display:swap; src:url(fonts/barlow-condensed-600.woff2) format("woff2")}
@font-face{font-family:"Barlow Condensed"; font-style:normal; font-weight:700; font-display:swap; src:url(fonts/barlow-condensed-700.woff2) format("woff2")}
@font-face{font-family:"Barlow Condensed"; font-style:normal; font-weight:800; font-display:swap; src:url(fonts/barlow-condensed-800.woff2) format("woff2")}
@font-face{font-family:"Inter"; font-style:normal; font-weight:400 700; font-display:swap; src:url(fonts/inter-var.woff2) format("woff2")}
:root{
  --bg:#F1F4F1; --card:#FFFFFF; --card2:#E8EDEA; --ink:#090D0E; --muted:#596462;
  --line:#D3DAD6; --accent:#0B7F76; --accent-fill:#34D6C4; --accent-soft:#D4F1EC;
  --good:#2E7D4F; --good-soft:#DDEEE4; --on-good:#FFFFFF; --on-bad:#FFFFFF;
  --prim:#C5352B; --ht:#2B5EC5; --supp:#2E8B57;
  --hi-soft:#E3F1E8; --mid-soft:#F7EBCB; --lo-soft:#F6DCD8; --on-rpe:#FFFFFF;
  --rpe5:#2E8B57; --rpe6:#6F9A2E; --rpe7:#A88B12; --rpe8:#D9791A; --rpe9:#D4502A; --rpe10:#C5352B;
  --shadow:0 1px 2px rgba(9,13,14,.06),0 4px 14px rgba(9,13,14,.05);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#090D0E; --card:#111719; --card2:#172024; --ink:#F7F9F8; --muted:#9BA7A5;
    --line:#243033; --accent:#34D6C4; --accent-fill:#34D6C4; --accent-soft:#34D6C42E;
    --good:#4FAF7C; --good-soft:#1E3A2C; --on-good:#0F2418; --on-bad:#2A0E0B;
    --prim:#E0554A; --ht:#6B93E8; --supp:#4FAF7C;
  --hi-soft:#1E3A2C; --mid-soft:#3A311A; --lo-soft:#3E1F1C; --on-rpe:#15171A;
  --rpe5:#4FAF7C; --rpe6:#8DB84A; --rpe7:#C9AE2F; --rpe8:#EE9A33; --rpe9:#E86A44; --rpe10:#E0554A;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3);
  }
}
:root[data-theme="light"]{
  --bg:#F1F4F1; --card:#FFFFFF; --card2:#E8EDEA; --ink:#090D0E; --muted:#596462;
  --line:#D3DAD6; --accent:#0B7F76; --accent-fill:#34D6C4; --accent-soft:#D4F1EC;
  --good:#2E7D4F; --good-soft:#DDEEE4; --on-good:#FFFFFF; --on-bad:#FFFFFF;
  --prim:#C5352B; --ht:#2B5EC5; --supp:#2E8B57;
  --hi-soft:#E3F1E8; --mid-soft:#F7EBCB; --lo-soft:#F6DCD8; --on-rpe:#FFFFFF;
  --rpe5:#2E8B57; --rpe6:#6F9A2E; --rpe7:#A88B12; --rpe8:#D9791A; --rpe9:#D4502A; --rpe10:#C5352B;
  --shadow:0 1px 2px rgba(9,13,14,.06),0 4px 14px rgba(9,13,14,.05);
}
:root[data-theme="dark"]{
  --bg:#090D0E; --card:#111719; --card2:#172024; --ink:#F7F9F8; --muted:#9BA7A5;
  --line:#243033; --accent:#34D6C4; --accent-fill:#34D6C4; --accent-soft:#34D6C42E;
  --good:#4FAF7C; --good-soft:#1E3A2C; --on-good:#0F2418; --on-bad:#2A0E0B;
  --prim:#E0554A; --ht:#6B93E8; --supp:#4FAF7C;
  --hi-soft:#1E3A2C; --mid-soft:#3A311A; --lo-soft:#3E1F1C; --on-rpe:#15171A;
  --rpe5:#4FAF7C; --rpe6:#8DB84A; --rpe7:#C9AE2F; --rpe8:#EE9A33; --rpe9:#E86A44; --rpe10:#E0554A;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 4px 14px rgba(0,0,0,.3);
}
*{box-sizing:border-box; margin:0}
html,body{background:var(--bg); color:var(--ink)}
body{
  font:16px/1.45 Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  padding-bottom:calc(76px + env(safe-area-inset-bottom));
  -webkit-text-size-adjust:100%;
}
.disp{font-family:"Barlow Condensed","Avenir Next Condensed","Arial Narrow","Helvetica Neue",-apple-system,sans-serif; font-weight:700; text-transform:uppercase; letter-spacing:.04em}
.num{font-family:ui-monospace,"SF Mono",Menlo,monospace; font-variant-numeric:tabular-nums}
.wrap{max-width:700px; margin:0 auto; padding:0 14px}
[hidden]{display:none !important}
a{color:var(--accent); font-weight:600}
button{font:inherit; color:inherit; background:none; border:none; cursor:pointer; -webkit-tap-highlight-color:transparent; touch-action:manipulation}
input,select,textarea{font:inherit; color:var(--ink); background:var(--card2); border:1px solid var(--line); border-radius:8px; padding:8px 10px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent); outline-offset:1px}
input::placeholder,textarea::placeholder{color:var(--muted)}

/* header */
header{padding:18px 0 10px}
header h1{font-size:30px; line-height:1.05; font-weight:800; letter-spacing:.03em}
header h1 .gold{color:var(--accent)}
header .sub{color:var(--muted); font-size:13px; margin-top:3px}

/* selector bar */
.progline{display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; padding:6px 0 8px; font-size:15px}
.progline .k{font-size:12px; color:var(--muted); letter-spacing:.06em; text-transform:uppercase}
.progline .from{font-size:12px; color:var(--muted)}
.selbar{padding:4px 0 10px; border-bottom:1px solid var(--line)}
.segrow{display:flex; gap:8px; align-items:center}
.segrow + .segrow{margin-top:8px}
.seglbl{font-size:12px; color:var(--muted); width:52px; flex:none}
.seg{display:flex; flex:1; background:var(--card2); border:1px solid var(--line); border-radius:9px; padding:2px; gap:2px}
.seg button{flex:1; padding:7px 0; border-radius:7px; font-size:14px; color:var(--muted); font-weight:600}
.seg button[aria-pressed="true"]{background:var(--card); color:var(--ink); box-shadow:var(--shadow)}
.seg button .dot{display:inline-block; width:6px; height:6px; border-radius:50%; background:var(--good); margin-left:5px; vertical-align:2px}
.weektag{font-size:12px; color:var(--muted); margin-top:8px; display:flex; justify-content:space-between; align-items:center}
.weektag b{color:var(--accent); font-weight:700}
.progstrip{display:flex; gap:3px; margin-top:9px}
.wkseg{flex:1; height:9px; border-radius:5px; background:var(--card2); border:1px solid var(--line); padding:0}
.wkseg.part{background:var(--accent-soft); border-color:var(--accent-fill)}
.wkseg.full{background:var(--accent-fill); border-color:var(--accent-fill)}
.wkseg.cur{box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--accent)}
.progmeta{display:flex; justify-content:space-between; font-size:12px; color:var(--muted); margin-top:7px}
.progmeta b{color:var(--ink); font-weight:600}
.emptycard{text-align:center; padding:26px 14px; color:var(--muted); font-size:14px}
.emptycard .btn{margin-top:12px}

/* cards */
.card{background:var(--card); border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow); padding:14px; margin:12px 0}
.sect{font-size:13px; color:var(--muted); margin:20px 0 4px; display:flex; align-items:center; gap:8px}
.sect::after{content:""; flex:1; height:1px; background:var(--line)}

/* train */
.tier{font-size:11px; font-weight:700; letter-spacing:.06em; display:inline-flex; align-items:center; gap:5px}
.tier .plate{width:9px; height:9px; border-radius:50%; border:2.5px solid; display:inline-block}
.tier.PRIM{color:var(--prim)} .tier.PRIM .plate{border-color:var(--prim)}
.tier.HT{color:var(--ht)} .tier.HT .plate{border-color:var(--ht)}
.tier.SUPP{color:var(--supp)} .tier.SUPP .plate{border-color:var(--supp)}
.sumbar{display:flex; align-items:center; gap:18px; padding:12px 14px}
.sumc{display:flex; flex-direction:column; gap:1px}
.sumc .k{font-size:11px; color:var(--muted); letter-spacing:.06em}
.sumc b{font-size:18px}
.finish{margin-left:auto; font-size:16px; font-weight:800; color:var(--accent); padding:8px 2px}
.finish.is-fin{color:var(--good)}
.exc{padding:12px 12px 10px}
.exhead{display:flex; align-items:flex-start; gap:10px}
.exinfo{flex:1; min-width:0}
.exname{font-size:18px; font-weight:700; line-height:1.2; margin-top:3px}
.rx{color:var(--muted); font-size:13px; margin-top:3px}
.rx b{color:var(--ink); font-weight:600}
.swbtn{flex:none; padding:6px 9px; border-radius:10px; background:var(--card2); color:var(--ink); font-weight:700; font-size:13px}
.dcol .btn .sub{display:block; font-weight:400; font-size:12px; opacity:.75; margin-top:2px; white-space:normal}
.restchip{display:inline-flex; align-items:center; gap:5px; padding:6px 9px; border-radius:10px; background:var(--accent-soft); color:var(--accent); font-weight:700; font-size:13px; flex:none}
.restchip select{appearance:none; -webkit-appearance:none; border:0; background:transparent; color:inherit; font:inherit; padding:0; width:auto; border-radius:0}
.hintbtn{display:block; width:100%; text-align:left; margin-top:10px; padding:8px 10px; border-radius:10px; background:var(--good-soft); color:var(--good); font-size:13px; font-weight:600}
.stable{margin-top:10px}
.shead,.srow{display:grid; grid-template-columns:32px minmax(44px,1fr) 52px 62px 46px 40px; gap:5px; align-items:center; margin:0 -6px; padding:0 6px}
.shead{font-size:11px; color:var(--muted); font-weight:600; text-align:center; padding-bottom:4px}
.srow{padding-top:4px; padding-bottom:4px; border-radius:10px}
.srow.hi{background:var(--hi-soft)} .srow.mid{background:var(--mid-soft)} .srow.lo{background:var(--lo-soft)}
.snum{height:40px; display:grid; place-items:center; border-radius:9px; background:var(--card2); color:var(--muted); font-weight:700; font-size:15px}
.sprev{font-size:11px; color:var(--muted); text-align:center; white-space:nowrap; line-height:1.15}
.sprev b{color:var(--accent); font-size:14px; font-weight:800}
.sprev small{display:block; font-size:10px}
.ormrow{display:flex; align-items:center; gap:8px; margin-top:10px; padding:8px 10px; border-radius:10px; background:var(--card2); font-size:13px; color:var(--muted)}
.ormrow.need{background:var(--accent-soft); color:var(--ink)}
.ormrow b{color:var(--ink)}
.ormpct{margin-left:auto; font-size:12px}
.ormrow input{width:84px; height:36px; text-align:center; font-weight:700; font-size:16px; padding:0}
.pwinfo{grid-column:1/-1; padding:10px 12px; border-radius:10px; background:var(--card2); font-size:13px; line-height:1.4}
.pwinfo .btn{margin-top:8px}
.exgrid{display:block}
@media(min-width:700px){
  .wrap{max-width:820px}
  body[data-tab="train"] .wrap, nav .in, #restbar .rrow, #sheet{max-width:1040px}
  .exgrid{display:grid; grid-template-columns:1fr 1fr; gap:0 14px; align-items:start}
  .selbar{display:grid; grid-template-columns:1fr 1fr 1fr; gap:6px 14px}
  .selbar .segrow+.segrow{margin-top:0}
  .selbar .weektag,.selbar .progstrip,.selbar .progmeta{grid-column:1/-1}
  .shead,.srow{grid-template-columns:30px minmax(50px,1fr) 56px 70px 54px 44px}
}
.fcell{height:40px; min-width:0; border-radius:9px; background:var(--card2); border:1.5px solid transparent; color:var(--ink); font-size:17px; font-weight:600; text-align:center; padding:0}
.fcell.ph{color:var(--muted); font-weight:500}
.fcell.dn{color:var(--rpe10)}
.livenote{margin:8px 0 2px; padding:8px 10px; border-radius:10px; background:var(--card2); font-size:13px; line-height:1.35; color:var(--muted)}
.livenote b{color:var(--ink)}
.livenote.up{border-left:3px solid var(--accent-fill); color:var(--ink)}
.livenote.dn{border-left:3px solid var(--rpe10); color:var(--ink)}
.fcell.up{color:var(--good)}
.fcell.rpec{font-size:14px}
.fcell.rpec.has{color:var(--c); font-weight:800; font-size:17px}
.fcell.act{border-color:var(--accent); box-shadow:0 0 0 2px var(--accent-soft)}
.scheck{height:40px; border-radius:9px; background:var(--card2); color:var(--muted); display:grid; place-items:center}
.scheck.hi{background:var(--good); color:var(--on-good)}
.scheck.mid{background:var(--accent-fill); color:#090D0E}
.scheck.lo{background:var(--prim); color:var(--on-bad)}
.exfoot{display:flex; gap:8px; margin-top:6px}
.addset{flex:1; padding:10px; border-radius:10px; background:var(--card2); font-weight:700; font-size:14px; color:var(--muted)}
.addset.rm{flex:none; color:var(--prim)}
.rownote{margin-top:8px; width:100%; font-size:16px; padding:8px 10px; background:none; border:1px dashed var(--line)}
.datefoot{display:flex; align-items:center; justify-content:flex-end; gap:8px; font-size:13px; color:var(--muted); margin:2px 2px 6px}
.datefoot input{font-size:16px; padding:4px 8px}
.chip{font-size:12px; font-weight:700; padding:4px 10px; border-radius:99px}
.chip.done{background:var(--good-soft); color:var(--good)}
.chip.part{background:var(--accent-soft); color:var(--accent)}

/* plan */
.acc{margin:10px 0}
.acc>button{width:100%; text-align:left; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px 14px; display:flex; align-items:center; box-shadow:var(--shadow)}
.acc>button .st{margin-left:auto; font-size:12px; color:var(--muted)}
.acc .body{padding:4px 2px 2px}
.mtabs{display:flex; gap:6px; margin:10px 0}
.mtabs button{font-size:13px; font-weight:600; color:var(--muted); padding:5px 12px; border:1px solid var(--line); border-radius:99px; background:var(--card2)}
.mtabs button[aria-pressed="true"]{background:var(--ink); color:var(--bg); border-color:var(--ink)}
.planslot{padding:12px 0 14px; border-top:1px solid var(--line)}
.slothead{display:flex; margin-bottom:8px}
.fields{display:grid; grid-template-columns:repeat(12,minmax(0,1fr)); gap:10px}
.fld.m5{grid-column:span 5} .fld.m7{grid-column:span 7} .fld.m8{grid-column:span 8} .fld.m4{grid-column:span 4}
.setline{display:flex; gap:8px; align-items:flex-end}
.setsel{flex:0 0 76px}
.styletip{margin-top:6px; font-size:12px; color:var(--muted); line-height:1.35}
.srs{display:flex; flex-wrap:wrap; gap:6px; min-width:0}
.rp{display:block; width:70px} .rp input{padding-left:6px; padding-right:6px; text-align:center} .rp span{display:block; font-size:10px; color:var(--muted); text-align:center; margin-bottom:1px}
.lensel{width:auto; min-width:0; padding-right:26px}
.lenlbl{display:flex; align-items:center; gap:8px; font-size:13px; color:var(--muted)}
.fld{display:block; min-width:0}
.fld.wide{grid-column:1/-1}
.fl{display:block; margin-bottom:4px; font-size:11px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--muted)}
.fld select,.fld input{width:100%; min-width:0}
.fld select.t-PRIM{color:var(--prim); font-weight:700}
.fld select.t-HT{color:var(--ht); font-weight:700}
.fld select.t-SUPP{color:var(--supp); font-weight:700}
.copybtns{display:flex; gap:8px; margin-top:8px}
.btn{background:var(--card2); border:1px solid var(--line); border-radius:9px; padding:8px 13px; font-size:14px; font-weight:600}
.btn.primary{background:var(--accent-fill); border-color:var(--accent-fill); color:#090D0E}
.btn.danger{color:var(--prim); border-color:var(--prim)}
.formline{display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin:8px 0}
.formline label{font-size:13px; color:var(--muted)}
.hint{font-size:13px; color:var(--muted); margin-top:6px}
.calcout{font-size:15px; margin-top:4px}
.calcout b{font-size:20px; color:var(--accent)}

/* progress */
.blocks{display:grid; grid-template-columns:repeat(3,1fr); gap:10px}
@media(max-width:520px){.blocks{grid-template-columns:1fr}}
.block h3{font-size:14px; margin-bottom:8px}
.wkgrid{display:grid; grid-template-columns:34px repeat(4,1fr); gap:4px; align-items:center}
.wkgrid .lbl{font-size:11px; color:var(--muted)}
.wkgrid .hd{font-size:11px; color:var(--muted); text-align:center}
.cell{height:26px; border-radius:6px; border:1px solid var(--line); background:var(--card2)}
.cell.part{background:var(--accent-soft); border-color:var(--accent-fill)}
.cell.full{background:var(--accent-fill); border-color:var(--accent-fill)}
.legend{display:flex; gap:14px; margin-top:10px; font-size:12px; color:var(--muted); align-items:center}
.legend .sw{display:inline-block; width:14px; height:14px; border-radius:4px; vertical-align:-2px; margin-right:5px; border:1px solid var(--line); background:var(--card2)}
.legend .sw.part{background:var(--accent-soft); border-color:var(--accent-fill)}
.legend .sw.full{background:var(--accent-fill); border-color:var(--accent-fill)}
#trendwrap{position:relative}
#trend{width:100%; height:210px; display:block; touch-action:pan-y}
.tip{position:absolute; pointer-events:none; background:var(--ink); color:var(--bg); font-size:12px; padding:4px 8px; border-radius:6px; transform:translate(-50%,-130%); white-space:nowrap; display:none}
table.datat{width:100%; border-collapse:collapse; font-size:14px; margin-top:8px}
table.datat th{text-align:left; color:var(--muted); font-weight:600; font-size:12px; padding:5px 8px; border-bottom:1px solid var(--line)}
table.datat td{padding:5px 8px; border-bottom:1px solid var(--line)}
table.datat td.n{text-align:right}
.statrow{display:flex; gap:10px; flex-wrap:wrap}
.stat{flex:1; min-width:120px; background:var(--card2); border:1px solid var(--line); border-radius:11px; padding:10px 12px}
.stat .v{font-size:24px; font-weight:700}
.stat .k{font-size:12px; color:var(--muted)}

/* data tab */
textarea#importbox{width:100%; min-height:90px; font-family:ui-monospace,Menlo,monospace; font-size:12px}

/* dock: rest timer, keypad sheet, tab bar */
#dock{position:fixed; left:0; right:0; bottom:0; z-index:30; background:var(--card); border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom)}
#dock.sheet-open nav{display:none}
nav .in{max-width:700px; margin:0 auto; display:flex}
nav button{flex:1; padding:10px 0 8px; color:var(--muted); font-size:11px; font-weight:600; display:flex; flex-direction:column; gap:3px; align-items:center}
nav button[aria-pressed="true"]{color:var(--accent)}
nav button svg{width:22px; height:22px}
#restbar{border-bottom:1px solid var(--line)}
#restbar .rprog{height:3px; background:var(--line)}
#restbar .rprog i{display:block; height:100%; width:0; background:var(--accent-fill)}
#restbar .rrow{max-width:700px; margin:0 auto; display:flex; align-items:center; gap:8px; padding:7px 14px; color:var(--accent)}
#restbar .rtime{font-size:24px; font-weight:700; min-width:64px}
#restbar .rlbl{flex:1; min-width:0; font-size:12px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
#restbar .rbtn{min-width:44px; height:38px; padding:0 10px; border-radius:9px; background:var(--card2); color:var(--ink); font-weight:700; font-size:14px}
#restbar.zero .rtime{color:var(--good)}
#restbar.zero .rprog i{background:var(--good)}
#sheet{max-width:700px; margin:0 auto; padding:4px 10px 10px}
.sh-top{display:flex; align-items:center; gap:8px; padding:2px 4px 6px}
.sh-title{flex:1; min-width:0; font-size:13px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.sh-title b{color:var(--ink)}
.sh-close{width:44px; height:34px; border-radius:8px; color:var(--muted); display:grid; place-items:center}
.rpe-row{display:flex; gap:6px; margin-bottom:8px}
.rpe-chip{flex:1; height:44px; border-radius:10px; font-weight:800; font-size:18px; color:var(--c); background:var(--card2); border:1.5px solid transparent}
.rpe-chip.on{background:var(--c); color:var(--on-rpe)}

/* ---------- helpers ---------- */
function num(v,d){ const n=parseFloat(v); return isFinite(n)?n:(d||0); }
const r0=n=>Math.round(n), f1=n=>(Math.round(n*10)/10).toFixed(1), pad=n=>(n<10?"0":"")+n;
const iso=dt=>dt.getFullYear()+"-"+pad(dt.getMonth()+1)+"-"+pad(dt.getDate());
function addDays(s,n){ const d=new Date(s+"T12:00:00"); d.setDate(d.getDate()+n); return iso(d); }
function dayDiff(a,b){ return Math.round((new Date(b+"T12:00:00")-new Date(a+"T12:00:00"))/86400000); }
const fmtShort=s=>new Date(s+"T12:00:00").toLocaleDateString(undefined,{day:"numeric",month:"short"});
const wkday=s=>new Date(s+"T12:00:00").toLocaleDateString(undefined,{weekday:"short",day:"numeric",month:"short"});
function sortBy(l,k){ return l.slice().sort((a,b)=>a[k]<b[k]?-1:a[k]>b[k]?1:0); }
function isoWeek(s){ const d=new Date(s+"T12:00:00"), day=(d.getDay()+6)%7; d.setDate(d.getDate()-day+3); const thu=new Date(d.getFullYear(),0,4); return 1+Math.round(((d-thu)/86400000-3+((thu.getDay()+6)%7))/7); }
const mondayOf=s=>addDays(s,-((new Date(s+"T12:00:00").getDay()+6)%7));
function plural(u,n){ if(n===1) return u; if(u==="half avocado") return "half avocados"; if(u==="tbsp"||u==="tsp") return u; if(u==="scoop") return "scoops"; return u+"s"; }

/* ---------- data ---------- */
function blank(){ return {v:1,profile:null,plan:[],days:{},weights:[],delw:[],meals:[],foods:UK_FOODS.map(ukFood)}; }
function normProfile(p){
  if(!p) return null;
  const inches=Math.round((p.heightFt!=null)?(num(p.heightFt)*12+num(p.heightIn)):(num(p.heightCm,0)/CM_IN));
  return {sex:p.sex==="m"?"m":"f",age:num(p.age,35),heightFt:Math.floor(inches/12),heightIn:inches%12,activity:num(p.activity,1.375),fallback:PHASES[p.fallback]?p.fallback:"maintenance"};
}
function fix(f){
  const d=blank(); if(!f||typeof f!=="object") return d;
  const o=Object.assign(d,f);
  o.plan=o.plan||[]; o.days=o.days||{}; o.weights=o.weights||[]; o.delw=o.delw||[]; o.meals=o.meals||[]; o.foods=(o.foods&&o.foods.length)?o.foods:d.foods;
  o.profile=normProfile(o.profile); return o;
}
const F=()=>state.food;
function has(f){ return !!(f&&((f.weights||[]).length||Object.keys(f.days||{}).some(k=>(f.days[k].items||[]).length)||(f.meals||[]).length||(f.plan||[]).length||f.profile)); }
/* what syncs as one unit, and how a merge treats each part (see mergeDocs) */
function cfg(){ const f=F(); return {profile:f.profile,plan:f.plan,meals:f.meals,foods:f.foods}; }
function merge(L,R,sl,sr){
  L=fix(L); R=fix(R); sl=sl||{}; sr=sr||{};
  const base=(sl.fcfg||0)>=(sr.fcfg||0)?L:R, out={v:1,profile:base.profile,plan:base.plan,meals:base.meals,foods:base.foods};
  out.delw=[...new Set([...(L.delw||[]),...(R.delw||[])])];
  const wm=new Map(); for(const w of [...L.weights,...R.weights]) if(!out.delw.includes(w.id)&&!wm.has(w.id)) wm.set(w.id,w);
  out.weights=[...wm.values()];
  out.days={}; const dl=sl.fdays||{}, dr=sr.fdays||{};
  for(const k of new Set([...Object.keys(L.days),...Object.keys(R.days)])){
    const a=L.days[k], b=R.days[k]; out.days[k]=(!b||(a&&(dl[k]||0)>=(dr[k]||0)))?a:b;
  }
  return JSON.parse(JSON.stringify(out));
}
/* bring in a backup from the old Macro Tracker artifact without overwriting anything already here */
function importLegacy(txt){
  let j; try{ j=JSON.parse(txt); }catch(e){ return {err:"That isn't valid backup text."}; }
  if(!j||typeof j!=="object"||(!j.diary&&!j.weights&&!j.meals&&!j.days)) return {err:"That doesn't look like a Macro Tracker backup."};
  const f=F(); let n={days:0,w:0,m:0,f:0,b:0};
  const days=j.days||{}; if(j.diary) for(const d in j.diary) days[d]={items:j.diary[d],type:(j.dayType||{})[d]||""};
  for(const d in days){ const it=(days[d].items||[]); if(!it.length) continue; if(!f.days[d]||!(f.days[d].items||[]).length){ f.days[d]={items:it,type:days[d].type||""}; n.days++; } }
  for(const w of (j.weights||[])) if(!f.weights.some(x=>x.id===w.id)&&!f.delw.includes(w.id)){ f.weights.push(w); n.w++; }
  for(const m of (j.meals||[])) if(!f.meals.some(x=>x.id===m.id)){ f.meals.push(m); n.m++; }
  for(const x of (j.foods||[])) if(!f.foods.some(y=>y.id===x.id||y.name.toLowerCase()===String(x.name).toLowerCase())){ f.foods.push(x); n.f++; }
  for(const b of (j.plan||[])) if(!f.plan.some(x=>x.id===b.id)){ f.plan.push(b); n.b++; }
  if(!f.profile&&j.profile) f.profile=normProfile(j.profile);
  return n;
}

function sumEntries(l){ return (l||[]).reduce((a,e)=>{ const m=e.g/100; a.k+=e.k*m; a.p+=e.p*m; a.c+=e.c*m; a.f+=e.f*m; return a; },{k:0,p:0,c:0,f:0}); }

function makeEntry(food,unit,qty){ const cnt=unit==="unit"&&food.unit, g=cnt?qty*food.unit.g:qty, e={n:food.name,g,k:food.k,p:food.p,c:food.c,f:food.f}; if(cnt){ e.q=qty; e.u=food.unit.name; } return e; }

/* Training or rest day, worked out from your workout log unless you set it by hand */
function autoType(d){
  const wd=workoutDays();
  if(wd[d]) return {type:"train",why:"workout logged"};
  if(Object.keys(wd).length<4) return {type:"train",why:"default until you have some workouts logged"};
  if(d<today()) return {type:"rest",why:"no workout logged"};
  let n=0; for(let i=1;i<=8;i++) if(wd[addDays(d,-7*i)]) n++;
  return n>=4?{type:"train",why:"you usually train on this day"}:{type:"rest",why:"you don't usually train on this day"};
}
/* ---------- phase logic ---------- */
const lenDays=b=>PHASES[b.phase].unit==="days"?b.len:b.len*7;
const endOf=b=>addDays(b.start,lenDays(b));
function calcTargets(key,dt,w,p){
  const pd=PHASES[key], kg=w*LB_KG, inches=p.heightFt*12+p.heightIn;
  const bmr=r0(10*kg+6.25*(inches*CM_IN)-5*p.age+(p.sex==="m"?5:-161)), tdee=r0(bmr*p.activity), kcal=r0(tdee*pd.pct/100), protein=r0(pd.protein*w);
  const type=pd.restOnly?"rest":dt, fat=pd.fat[type], carbs=Math.max(0,r0((kcal-protein*4-fat*9)/4));
  const pc=kcal?{p:r0(protein*4/kcal*100),f:r0(fat*9/kcal*100),c:r0(carbs*4/kcal*100)}:{p:0,f:0,c:0};
  return {bmr,tdee,kcal,protein,fat,carbs,type,pc};
}
function blockFor(d){ for(const b of sortBy(F().plan,"start")) if(d>=b.start&&d<endOf(b)) return b; return null; }
function targetsFor(d){
  const f=F(), block=blockFor(d), key=block?block.phase:(f.profile?f.profile.fallback:"maintenance");
  const rec=f.days[d], w=latestWeight(); let dt, auto=null;
  if(PHASES[key].restOnly) dt="rest"; else if(rec&&rec.type) dt=rec.type; else { auto=autoType(d); dt=auto.type; }
  const out={key,block,dayType:dt,auto,ready:false};
  if(f.profile&&w!=null){ out.ready=true; out.weight=w; Object.assign(out,calcTargets(key,dt,w,f.profile)); }

}

function planWarnings(){

    else if(pd.warnAt&&b.len>=pd.warnAt) out.push({cls:"warn",text:pd.label+" from "+fmtShort(b.start)+(b.len===pd.max?" is at its limit":" is close to its limit")+" ("+b.len+" of "+pd.max+" weeks)."});
    for(let j=i+1;j<plan.length;j++){ const o=plan[j];

}

  }else if(i!==ref&&rl&&rl.sets&&has(rl.sets[ref])){
    return {v:fmtKg(roundW(parseFloat(rl.sets[ref].w)*styleMult(style,i,n)/styleMult(style,ref,n))),up:false};
  }
  const ls=lastSession(m,w,s,slot,exAt(s,m,w,slot)); if(!ls) return null;
  const pr=progressFor(m,w,s,slot), pick=k=>okSet(ls.sets[k])?ls.sets[k]:ls.oks[ls.oks.length-1];
  const k0=shaped?ref:i, base=parseFloat(pick(k0).w); if(isNaN(base)) return null;
  const d=pr.delta(k0);
  if(!shaped) return {v:fmtKg(base+d),up:d>0};
  return {v:fmtKg(roundW((base+d)*styleMult(style,i,n)/styleMult(style,ref,n))),up:d>0};
}

/* ---- muscle volume, blocks and programmes ---- */
function muscleOf(p){ return MUSCLES.includes(p.grp)?p.grp:(p.ex?findGroup(p.ex):""); }
function weekMuscles(m,w){
  const planned={}, done={};
  for(const s of SESSIONS) for(const sl of SLOTS){
    const p=slotPlan(s,m,sl.id); if(!p.ex&&!MUSCLES.includes(p.grp)) continue;
    const mu=muscleOf(p)||"Other", rl=rowLog(m,w,s,sl.id,false);
    planned[mu]=(planned[mu]||0)+rxFor(s,m,w,sl.id).sets+((rl&&rl.extra)||0);
    if(rl&&rl.sets) for(const x of rl.sets) if(okSet(x)) done[mu]=(done[mu]||0)+1;
  }
  return {planned,done};
}
function blockStats(plan,logs){
  const st={sessions:0,planned:0,sets:0,volume:0,muscles:{},first:"",last:""};
  for(let m=1;m<=MONTHS();m++) for(let w=1;w<=wksIn(m);w++) for(const s of SESSIONS){
    const L=logs[m+"-"+w+"-"+s]; let need=0,done=0,any=false;
    for(const sl of SLOTS){
      const p=plan[s]&&plan[s][m]&&plan[s][m][sl.id]; if(!p||!p.ex) continue; any=true;
      const rl=L&&L.rows&&L.rows[sl.id];
      need+=rxFor(s,m,w,sl.id,plan).sets+((rl&&rl.extra)||0);
      if(rl&&Array.isArray(rl.sets)) for(const x of rl.sets) if(okSet(x)){ done++; st.sets++; st.volume+=(parseFloat(x.w)||0)*x.r; const mu=muscleOf(p)||"Other"; st.muscles[mu]=(st.muscles[mu]||0)+1; }
    }
    if(any){ st.planned++; if(need&&done>=need) st.sessions++; }
    if(L&&L.date){ if(!st.first||L.date<st.first) st.first=L.date; if(L.date>st.last) st.last=L.date; }
  }
  return st;
}
function shortDate(iso){ return iso?new Date(iso+"T12:00:00").toLocaleDateString(undefined,{day:"numeric",month:"short",year:"numeric"}):"–"; }
function progSummary(plan){ const c=s=>SLOTS.filter(sl=>plan[s]&&plan[s][1]&&plan[s][1][sl.id]&&(plan[s][1][sl.id].ex||MUSCLES.includes(plan[s][1][sl.id].grp))).length; return SESSIONS.filter(s=>s!=="E"||c(s)>0).map(s=>s+" "+c(s)).join(" · "); }
function archiveBlock(){

}

function saveProgramme(name,plan,markActive,weeks){

/* ================= CLOUD SYNC (Supabase over plain HTTPS) ================= */
const SYNC_KEY="bpp5.sync", SYNC_T="/rest/v1/bp5_state";
let sync=(()=>{
  const d={url:"",key:"",session:null,deviceId:Math.random().toString(36).slice(2,8),baseRev:0,pushedHash:"",lastSync:0};
  try{ Object.assign(d,JSON.parse(localStorage.getItem(SYNC_KEY)||"{}")); }catch(e){}
  return Object.assign(d,{busy:false,again:false,status:d.session?"idle":"off",msg:"",lastTry:0,t:null});
})();
function persistSync(){ try{ const {url,key,session,deviceId,baseRev,pushedHash,lastSync}=sync; localStorage.setItem(SYNC_KEY,JSON.stringify({url,key,session,deviceId,baseRev,pushedHash,lastSync})); }catch(e){} }
function hstr(x){ let h=5381; for(let i=0;i<x.length;i++) h=((h<<5)+h+x.charCodeAt(i))|0; return String(h); }
function canon(o){ if(o===null||typeof o!=="object") return JSON.stringify(o); if(Array.isArray(o)) return "["+o.map(canon).join(",")+"]"; return "{"+Object.keys(o).sort().map(k=>JSON.stringify(k)+":"+canon(o[k])).join(",")+"}"; }
function contentHash(d){ d=d||state; return hstr(canon({plan:d.plan,library:d.library,logs:d.logs,programmes:d.programmes,blocks:d.blocks,block:d.block,name:d.name,food:d.food})); }
const HASHES={cfg:null,logs:{},fcfg:null,fdays:{}};
function cfgDoc(){ return {plan:state.plan,library:state.library,hiddenPresets:state.hiddenPresets,programmes:state.programmes,blocks:state.blocks,block:state.block,name:state.name}; }
function baselineHashes(){ HASHES.cfg=hstr(JSON.stringify(cfgDoc())); HASHES.fcfg=hstr(JSON.stringify(Food.cfg())); HASHES.fdays={}; for(const k in state.food.days) HASHES.fdays[k]=hstr(JSON.stringify(state.food.days[k])); HASHES.logs={}; for(const k in state.logs) HASHES.logs[k]=hstr(JSON.stringify(state.logs[k])); }
/* remember when each part last changed on this device, so a merge can keep the newer side */
function stampChanges(){
  const now=Date.now(), sm=state.sm;
  const ch=hstr(JSON.stringify(cfgDoc())); if(ch!==HASHES.cfg){ sm.cfg=now; HASHES.cfg=ch; }
  for(const k in state.logs){ const lh=hstr(JSON.stringify(state.logs[k])); if(HASHES.logs[k]!==lh){ sm.logs[k]=now; HASHES.logs[k]=lh; } }
  for(const k in sm.logs) if(!(k in state.logs)){ delete sm.logs[k]; delete HASHES.logs[k]; }
  const fh=hstr(JSON.stringify(Food.cfg())); if(fh!==HASHES.fcfg){ sm.fcfg=now; HASHES.fcfg=fh; }
  sm.fdays=sm.fdays||{};
  for(const k in state.food.days){ const dh=hstr(JSON.stringify(state.food.days[k])); if(HASHES.fdays[k]!==dh){ sm.fdays[k]=now; HASHES.fdays[k]=dh; } }
}
baselineHashes();
function exportDoc(){ return JSON.parse(JSON.stringify({plan:state.plan,library:state.library,hiddenPresets:state.hiddenPresets,logs:state.logs,programmes:state.programmes,blocks:state.blocks,block:state.block,name:state.name,food:state.food,sm:state.sm})); }

  state.plan=d.plan; state.library=d.library; state.hiddenPresets=d.hiddenPresets||[]; state.logs=d.logs||{}; state.programmes=d.programmes||[]; state.blocks=d.blocks||[]; state.block=d.block; state.name=d.name||""; state.food=d.food||Food.blank(); state.sm=d.sm||{cfg:0,logs:{}};
  migrate(); baselineHashes();

function docEmpty(d){
  const hasPlan=SESSIONS.some(s=>[1,2,3].some(m=>SLOTS.some(sl=>d.plan&&d.plan[s]&&d.plan[s][m]&&d.plan[s][m][sl.id]&&d.plan[s][m][sl.id].ex)));
  return !hasPlan&&!blockStats(d.plan,d.logs||{}).sets&&!(d.programmes||[]).length&&!(d.blocks||[]).length&&!Food.has(d.food);

function unionById(a,b,pick){ const m=new Map(); for(const x of (a||[])) m.set(x.id,x); for(const x of (b||[])){ const y=m.get(x.id); m.set(x.id,y&&pick?pick(y,x):(y||x)); } return [...m.values()]; }
/* Merge two copies of the data. Logs: per session, newest edit wins. Plan/library/name: whichever side was edited last.

function mergeDocs(L,R){
  const cp=o=>JSON.parse(JSON.stringify(o));
  L.sm=L.sm||{cfg:0,logs:{}}; R.sm=R.sm||{cfg:0,logs:{}};
  if(docEmpty(L)) return cp(R);
  if(docEmpty(R)) return cp(L);
  const out={}, lNew=(L.sm.cfg||0)>=(R.sm.cfg||0), base=lNew?L:R, sm={cfg:Math.max(L.sm.cfg||0,R.sm.cfg||0),logs:{}};
  out.blocks=unionById(cp(L.blocks),cp(R.blocks));
  out.programmes=unionById(cp(L.programmes),cp(R.programmes),(x,y)=>(x.saved>=y.saved?x:y));
  out.food=Food.merge(L.food,R.food,L.sm,R.sm);
  out.library=cp(base.library); out.hiddenPresets=cp(base.hiddenPresets||[]); out.name=base.name||L.name||R.name||"";
  if(L.block.id===R.block.id){
    out.block=cp(base.block); out.plan=cp(base.plan); out.logs={};
    { const other=base===L?R:L; if(other.block.orm||base.block.orm) out.block.orm=Object.assign({},other.block.orm,base.block.orm); }   // 1RMs: keep ones only the other device has
    for(const k of new Set([...Object.keys(L.logs||{}),...Object.keys(R.logs||{})])){
      const a=(L.logs||{})[k], b=(R.logs||{})[k], ta=(L.sm.logs||{})[k]||0, tb=(R.sm.logs||{})[k]||0;
      out.logs[k]=cp((!b||(a&&ta>=tb))?a:b); sm.logs[k]=Math.max(ta,tb);
    }

    const lWins=(L.block.start>R.block.start)||(L.block.start===R.block.start&&lNew), win=lWins?L:R, lose=lWins?R:L;
    out.block=cp(win.block); out.plan=cp(win.plan); out.logs=cp(win.logs||{});
    for(const k in out.logs) sm.logs[k]=(win.sm.logs||{})[k]||0;
    const ls=blockStats(lose.plan,lose.logs||{}), arch=out.blocks.find(b=>b.id===lose.block.id);
    if(arch){   // already archived by the other device: fold in any sessions only this side has
      let added=false; for(const k in (lose.logs||{})) if(!(k in arch.logs)){ arch.logs[k]=cp(lose.logs[k]); added=true; }
      if(added) arch.summary=blockStats(arch.plan,arch.logs);
    }else if(ls.sets) out.blocks.push({id:lose.block.id,name:lose.block.name||"Untitled block",progId:lose.block.progId||"",start:lose.block.start,end:todayISO(),plan:cp(lose.plan),logs:cp(lose.logs||{}),summary:ls});
  }

}
/* ---- talking to Supabase ---- */
function setSession(j){ sync.session={access:j.access_token,refresh:j.refresh_token,exp:Date.now()+(j.expires_in||3600)*1000,uid:(j.user&&j.user.id)||(sync.session&&sync.session.uid),email:(j.user&&j.user.email)||(sync.session&&sync.session.email)}; persistSync(); }
async function refreshSession(){
  const r=await fetch(sync.url+"/auth/v1/token?grant_type=refresh_token",{method:"POST",headers:{apikey:sync.key,"Content-Type":"application/json"},body:JSON.stringify({refresh_token:sync.session.refresh})});
  const j=await r.json().catch(()=>({}));
  if(!r.ok||!j.access_token){ const e=new Error("signed-out"); e.auth=true; throw e; }
  setSession(j);
}
async function api(path,opts,retried){
  if(!sync.session){ const e=new Error("signed-out"); e.auth=true; throw e; }
  if(sync.session.exp-Date.now()<60000) await refreshSession();
  const r=await fetch(sync.url+path,Object.assign({},opts,{headers:Object.assign({apikey:sync.key,Authorization:"Bearer "+sync.session.access,"Content-Type":"application/json"},(opts&&opts.headers)||{})}));
  if(r.status===401&&!retried){ await refreshSession(); return api(path,opts,true); }
  return r;
}
async function must(r){ if(r.ok) return r; const j=await r.json().catch(()=>({})); const e=new Error(j.message||j.msg||("HTTP "+r.status)); e.status=r.status; e.code=j.code; throw e; }
async function getRows(q){ const r=await must(await api(SYNC_T+"?"+q)); return r.json(); }
async function patchRow(me,rev,doc){ const r=await must(await api(SYNC_T+"?user_id=eq."+me+"&rev=eq."+rev,{method:"PATCH",headers:{Prefer:"return=representation"},body:JSON.stringify({data:doc,rev:rev+1,device:sync.deviceId})})); return r.json(); }
function scheduleSync(ms){ if(!sync.session) return; clearTimeout(sync.t); sync.t=setTimeout(()=>syncNow(),ms||4000); }
function setSync(st,msg){ sync.status=st; sync.msg=msg||""; paintSync(); }
function statusLine(){
  const t=sync.lastSync?new Date(sync.lastSync).toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"}):"";
  return {syncing:"Syncing…",ok:"Up to date · last sync "+t,offline:"Offline — will retry when you're back online",err:"Problem: "+sync.msg,signedout:"Signed out — sign in again",idle:"Ready"}[sync.status]||"";
}
function paintSync(){
  const dot=$("#syncdot"), stat=$("#syncstat");
  const short={syncing:"☁ syncing…",ok:"☁ synced",offline:"☁ offline",err:"☁ sync problem",signedout:"☁ signed out",idle:"☁"}[sync.status]||"";
  if(dot) dot.textContent=sync.session||sync.status==="signedout"?" · "+short:"";
  if(stat) stat.textContent=statusLine();
}
function handleSyncError(e){
  if(e&&e.auth){ sync.session=null; persistSync(); setSync("signedout"); toast("Signed out of cloud sync — sign in again"); if(state.tab==="data") render(); return; }
  if(e instanceof TypeError||/Failed to fetch|NetworkError|Load failed/i.test(e.message||"")){ setSync("offline"); scheduleSync(30000); return; }
  if(e.status===404||e.code==="PGRST205"||e.code==="42P01"){ setSync("err","the cloud table is missing — run the setup SQL (see SYNC-SETUP.md)"); return; }
  setSync("err",e.message||"unknown error");
}
async function syncNow(){
  if(!sync.session) return;
  if(sync.busy){ sync.again=true; return; }
  if(entry){ scheduleSync(8000); return; }       // never swap data underneath an open keypad
  sync.busy=true; sync.lastTry=Date.now(); setSync("syncing");
  try{
    let done=false;
    for(let attempt=0;attempt<4&&!done;attempt++){
      flushSave(true);
      const me=sync.session.uid, doc=exportDoc(), ch=contentHash(doc);
      const head=await getRows("select=rev&user_id=eq."+me), rrev=head.length?head[0].rev:0;
      if(rrev===0){
        const r=await api(SYNC_T,{method:"POST",headers:{Prefer:"return=minimal"},body:JSON.stringify({user_id:me,data:doc,rev:1,device:sync.deviceId})});
        if(r.status===409) continue;
        await must(r); sync.baseRev=1; sync.pushedHash=ch; done=true; break;
      }
      if(rrev===sync.baseRev){
        if(ch===sync.pushedHash){ done=true; break; }
        const rows=await patchRow(me,rrev,doc);
        if(rows.length){ sync.baseRev=rrev+1; sync.pushedHash=ch; done=true; }
        continue;
      }
      const remote=(await getRows("select=rev,data&user_id=eq."+me))[0]; if(!remote) continue;
      const merged=mergeDocs(doc,remote.data);
      if(contentHash(exportDoc())!==ch) continue;      // edited while we were talking to the server: go round again
      applyDoc(merged);
      const doc2=exportDoc(), c2=contentHash(doc2);
      if(contentHash(remote.data)===c2){ sync.baseRev=remote.rev; sync.pushedHash=c2; done=true; break; }
      const rows=await patchRow(me,remote.rev,doc2);
      if(rows.length){ sync.baseRev=remote.rev+1; sync.pushedHash=c2; done=true; }
    }
    if(!done) throw new Error("the cloud copy kept changing — will retry");
    sync.lastSync=Date.now(); setSync("ok");
  }catch(e){ handleSyncError(e); }
  finally{ sync.busy=false; persistSync(); if(sync.again){ sync.again=false; scheduleSync(1500); } }
}
async function authenticate(kind){
  const q=id=>document.getElementById(id);
  const url=q("sy-url").value.trim().replace(/\/+$/,""), key=q("sy-key").value.trim(), email=q("sy-email").value.trim(), pass=q("sy-pass").value;
  if(!/^https?:\/\/[^\s]+$/.test(url)||!key||!email||!pass){ toast("Fill in the project address, key, email and password"); return; }
  sync.url=url; sync.key=key;
  try{
    const r=await fetch(url+(kind==="up"?"/auth/v1/signup":"/auth/v1/token?grant_type=password"),{method:"POST",headers:{apikey:key,"Content-Type":"application/json"},body:JSON.stringify({email,password:pass})});
    const j=await r.json().catch(()=>({}));
    if(!r.ok){ toast(j.error_description||j.msg||j.message||"Couldn't sign in"); return; }
    if(!j.access_token){ persistSync(); toast("Account created — confirm the email sent to you, then press Sign in"); return; }
    sync.baseRev=0; sync.pushedHash=""; setSession(j); setSync("syncing"); toast("Signed in"); render(); await syncNow();
  }catch(e){ toast("Can't reach that project — check the address and your connection"); }
}

function wireSync(v){
  const on=(id,fn)=>{ const el=v.querySelector("#"+id); if(el) el.addEventListener("click",fn); };
  on("sy-in",()=>authenticate("in")); on("sy-up",()=>authenticate("up"));

}

function rerender(){ const y=window.scrollY; render(); window.scrollTo(0,y); }

/* ---- keypad sheet ---- */
function openEntry(slot,i,f){ entry={slot,i,field:f,buf:"",fresh:true,help:false}; setEntryField(f); }
function setEntryField(f){
  const {m,w,s}=state.pos, x=setAt(m,w,s,entry.slot,entry.i,false)||{};
  const cur=f==="r"?x.r:(f==="w"?x.w:x.rpe);
  entry.field=f; entry.buf=(cur==null||cur===0)?"":String(cur); entry.fresh=true; entry.help=false;
  renderDock(); rerender(); ensureVisible();
}
function closeEntry(){ if(!entry) return; entry=null; renderDock(); if(state.tab==="train") rerender(); }
function ensureVisible(){
  if(!entry) return;
  const el=document.querySelector(`[data-cell="${entry.slot}|${entry.i}|${entry.field}"]`); if(!el) return;
  const top=$("#dock").getBoundingClientRect().top, r=el.getBoundingClientRect();
  if(r.bottom>top-16||r.top<70) window.scrollBy({top:r.top-Math.max(90,top*0.3),behavior:"smooth"});
}
function keyPress(k){
  if(!entry) return;
  const {slot,i,field}=entry, {m,w,s}=state.pos, p=slotPlan(s,m,slot);
  const st=setAt(m,w,s,slot,i,true);
  let b=entry.fresh?"":entry.buf, stepped=false;
  if(k==="bs"){ b=entry.buf.slice(0,-1); }
  else if(k==="."){ if(field==="r") return; if(!b.includes(".")) b=(b||"0")+"."; }
  else if(k==="up"||k==="down"){
    const dir=k==="up"?1:-1; stepped=true;
    if(field==="w"){ const sg=suggestW(m,w,s,slot,i); const base=parseFloat(entry.buf)||parseFloat(st.w)||(sg?parseFloat(sg.v):0)||0; b=fmtKg(Math.max(0,base+dir*stepW(p))); }
    else if(field==="r"){ const top=rangeAt(rxFor(s,m,w,slot),i)[1]; const base=parseInt(entry.buf)||(st.r>0?st.r:top); const v=Math.max(0,base+dir); b=v?String(v):""; }
    else { const base=parseFloat(entry.buf)||st.rpe||7; b=fmtKg(Math.min(10,Math.max(1,base+dir*0.5))); }
  }
  else {
    const nb=b+k;
    if(field==="r"){ if(nb.length>3) return; b=nb; }
    else if(field==="w"){ if(nb.replace(".","").length>6||/\.\d{3}/.test(nb)) return; b=nb; }
    else { b=(parseFloat(nb)>10)?k:nb; }
  }
  entry.fresh=stepped; entry.buf=b;
  if(field==="r"){ st.r=b===""?null:parseInt(b); if(!(st.r>0)){ st.r=null; st.ok=false; } }
  else if(field==="w"){ st.w=b; }
  else { const v=parseFloat(b); st.rpe=(v>=1&&v<=10)?v:null; }
  save(); renderDock(); rerender();
}
function pickRpe(v){
  if(!entry) return;
  const {m,w,s}=state.pos, st=setAt(m,w,s,entry.slot,entry.i,true);
  st.rpe=(st.rpe===v)?null:v;
  if(entry.field==="rpe"){ entry.buf=st.rpe?String(st.rpe):""; entry.fresh=true; }
  save(); renderDock(); rerender();
}
function nextField(){
  if(!entry) return;
  const {m,w,s}=state.pos, order=["r","w","rpe"], k=order.indexOf(entry.field);
  if(k<2) return setEntryField(order[k+1]);
  const n=rxFor(s,m,w,entry.slot).sets+((rowLog(m,w,s,entry.slot,false)||{}).extra||0);
  if(entry.i+1<n) openEntry(entry.slot,entry.i+1,"r"); else closeEntry();
}
function completeSet(slot,i){
  const {m,w,s}=state.pos, p=slotPlan(s,m,slot), top=rangeAt(rxFor(s,m,w,slot),i)[1];
  const st=setAt(m,w,s,slot,i,true);
  if(!(st.r>0)) st.r=top;
  let wv=parseFloat(st.w);
  if(isNaN(wv)){ const sg=suggestW(m,w,s,slot,i); if(sg) wv=parseFloat(sg.v); }
  if(isNaN(wv)){ toast("Enter the weight for set "+(i+1)); openEntry(slot,i,"w"); return false; }
  st.w=fmtKg(wv); st.ok=true;
  const L=getLog(m,w,s,true), now=Date.now();
  if(!L.t0) L.t0=now; L.t1=now; if(!L.date) L.date=todayISO();
  save(); startRest(restOf(p),p.ex);
  return true;
}
function toggleOk(slot,i){
  const {m,w,s}=state.pos;
  if(entry){ entry=null; renderDock(); }
  const st=setAt(m,w,s,slot,i,false);
  if(okSet(st)){ st.ok=false; save(); rerender(); return; }
  if(completeSet(slot,i)) rerender();
}
function doneEntry(){
  if(!entry) return;
  const {slot,i}=entry;
  if(completeSet(slot,i)){ entry=null; renderDock(); rerender(); }
}
function sheetClick(e){
  const b=e.target.closest("button"); if(!b||b.disabled||!entry) return;
  if(b.dataset.k) return keyPress(b.dataset.k);
  if(b.dataset.rpe) return pickRpe(+b.dataset.rpe);
  const a=b.dataset.sh;
  if(a==="close") closeEntry();
  else if(a==="next") nextField();
  else if(a==="done") doneEntry();
  else if(a==="help"){ entry.help=true; renderDock(); }
  else if(a==="helpclose"){ entry.help=false; renderDock(); }
}
function physKeys(e){
  if(!entry||e.metaKey||e.ctrlKey||e.altKey) return;
  const t=e.target; if(t&&/^(INPUT|SELECT|TEXTAREA)$/.test(t.tagName)) return;
  if(/^[0-9]$/.test(e.key)) keyPress(e.key);
  else if(e.key===".") keyPress(".");
  else if(e.key==="Backspace") keyPress("bs");
  else if(e.key==="Enter") doneEntry();
  else if(e.key==="Escape") closeEntry();
  else if(e.key==="Tab") nextField();
  else return;
  e.preventDefault();
}
(function(){
  const v=document.getElementById("view");
  v.addEventListener("click",e=>{ const el=e.target.closest&&e.target.closest("[data-fa]"); if(el&&Food.act(el.dataset.fa,el.dataset)) e.stopPropagation(); });
  v.addEventListener("change",e=>{ const el=e.target.closest&&e.target.closest("[data-fc]"); if(el) Food.chg(el.dataset.fc,el); });
  v.addEventListener("input",e=>{ const el=e.target.closest&&e.target.closest("[data-fc=pickQty]"); if(el) Food.chg("pickQty",el); });
})();
function renderDock(){

const LM={Chest:[14,16,18], Back:[18,20,22], Triceps:[12,14,16], Biceps:[14,16,18], Delts:[12,14,16], Quads:[16,18,20], Glutes:[14,16,18], Hams:[12,14,16]};

function lmTotals(o){ const r={}; for(const k of Object.keys(o)){ const g=k==="Other"?"Other":lmGroup(k); const e=r[g]||(r[g]={n:0,p:{}}); e.n+=o[k]; e.p[k]=o[k]; } return r; }

  const P=lmTotals(planned), D=lmTotals(done);

    const band=L?`<i class="mband" style="left:${pct(L[0])};width:${(L[2]-L[0])/max*100}%"></i><i class="mmrv" style="left:${pct(L[1])};width:${(L[2]-L[1])/max*100}%"></i><i class="mmav" style="left:${pct(L[0])}"></i>`:"";

const isoOf=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
/* every finished-set day across the current block and archived blocks: [{date, sets, mu:{muscle:sets}}] */
function workoutDays(){
  const days={};
  const scan=(plan,logs)=>{
    for(const k in (logs||{})){
      const L=logs[k]; if(!L||!L.date||!L.rows) continue;
      const [m,,s]=k.split("-"); let n=0; const mu={};
      for(const sl of SLOTS){
        const rl=L.rows[sl.id]; if(!rl||!Array.isArray(rl.sets)) continue;
        const c=rl.sets.filter(okSet).length; if(!c) continue;
        const p=plan&&plan[s]&&plan[s][m]&&plan[s][m][sl.id]; if(!p) continue;
        const g=rl.ex?(findGroup(rl.ex)||muscleOf(p)):muscleOf(p);
        n+=c; if(g) mu[g]=(mu[g]||0)+c;
      }
      if(!n) continue;
      const d=days[L.date]||(days[L.date]={date:L.date,sets:0,mu:{}});
      d.sets+=n; for(const g in mu) d.mu[g]=(d.mu[g]||0)+mu[g];
    }
  };
  scan(state.plan,state.logs);
  for(const b of state.blocks) scan(b.plan,b.logs);
  return days;
}

function loggedExercises(){
  const set=new Set();
  for(let m=1;m<=3;m++) for(let w=1;w<=4;w++) for(const s of SESSIONS){
    const L=getLog(m,w,s,false); if(!L) continue;
    for(const sl of SLOTS){
      const r=L.rows[sl.id];
      if(r&&Array.isArray(r.sets)&&r.sets.some(x=>okSet(x)&&parseFloat(x.w)>0)){ const ex=exAt(s,m,w,sl.id); if(ex) set.add(ex); }
    }
  }
  return [...set].sort();
}
function trendPoints(ex){
  const pts=[];
  for(let m=1;m<=3;m++) for(let w=1;w<=4;w++){
    let best=null,sets=0;
    for(const s of SESSIONS) for(const sl of SLOTS){
      if(exAt(s,m,w,sl.id)!==ex) continue;
      const r=rowLog(m,w,s,sl.id,false); if(!r||!Array.isArray(r.sets)) continue;
      for(const x of r.sets){ if(!okSet(x)) continue; const wt=parseFloat(x.w); if(!(wt>0)) continue; if(best==null||wt>best) best=wt; sets++; }
    }
    if(best!=null) pts.push({m,w,wt:best,sets,x:(m-1)*4+w});
  }
  return pts;
}
function drawTrend(){
  const cv=$("#trend"); if(!cv) return;
  const ex=$("#trendsel")?$("#trendsel").value:""; if(!ex) return;
  const pts=trendPoints(ex);
  const css=getComputedStyle(document.documentElement);
  const C={line:css.getPropertyValue("--line").trim(),muted:css.getPropertyValue("--muted").trim(),accent:css.getPropertyValue("--accent-fill").trim(),ink:css.getPropertyValue("--ink").trim(),card:css.getPropertyValue("--card").trim()};
  const dpr=window.devicePixelRatio||1, W=cv.clientWidth, H=210;
  cv.width=W*dpr; cv.height=H*dpr;
  const ctx=cv.getContext("2d"); ctx.scale(dpr,dpr); ctx.clearRect(0,0,W,H);
  if(!pts.length) return;
  const padL=40,padR=16,padT=18,padB=26;
  const xs=pts.map(p=>p.x), lo=Math.min(...pts.map(p=>p.wt)), hi=Math.max(...pts.map(p=>p.wt));
  const ymin=Math.max(0,lo-(hi-lo||10)*0.25), ymax=hi+(hi-lo||10)*0.25;
  const X=x=>padL+(W-padL-padR)*(xs.length>1?(x-xs[0])/(xs[xs.length-1]-xs[0]||1):0.5);
  const Y=v=>padT+(H-padT-padB)*(1-(v-ymin)/(ymax-ymin||1));
  ctx.strokeStyle=C.line; ctx.fillStyle=C.muted; ctx.lineWidth=1; ctx.font="11px ui-monospace,Menlo,monospace";
  for(let i=0;i<=3;i++){ const v=ymin+(ymax-ymin)*i/3, y=Y(v);
    ctx.globalAlpha=.6; ctx.beginPath(); ctx.moveTo(padL,y); ctx.lineTo(W-padR,y); ctx.stroke(); ctx.globalAlpha=1;
    ctx.fillText(String(Math.round(v)),6,y+4);
  }
  for(const p of pts){ ctx.fillText("W"+p.x, X(p.x)-8, H-8); }
  ctx.strokeStyle=C.accent; ctx.lineWidth=2; ctx.lineJoin="round"; ctx.beginPath();
  pts.forEach((p,i)=>{ const x=X(p.x),y=Y(p.wt); i?ctx.lineTo(x,y):ctx.moveTo(x,y); });
  ctx.stroke();
  pts.forEach((p,i)=>{
    const x=X(p.x),y=Y(p.wt), end=i===pts.length-1;
    ctx.beginPath(); ctx.arc(x,y,end?5:3.5,0,7); ctx.fillStyle=C.accent; ctx.fill();
    ctx.lineWidth=2; ctx.strokeStyle=C.card; ctx.stroke();
  });
  const lp=pts[pts.length-1];
  ctx.fillStyle=C.ink; ctx.font="700 12px ui-monospace,Menlo,monospace";
  ctx.fillText(lp.wt+" kg", Math.min(X(lp.x)+8,W-56), Y(lp.wt)-8);
  cv._pts=pts.map(p=>({px:X(p.x),py:Y(p.wt),p}));
  cv.onpointermove=cv.onpointerdown=(e)=>{
    const r=cv.getBoundingClientRect(), mx=e.clientX-r.left;
    let best=null; for(const q of cv._pts){ if(best==null||Math.abs(q.px-mx)<Math.abs(best.px-mx)) best=q; }
    const tip=$("#tip");
    if(best){ tip.style.display="block"; tip.style.left=best.px+"px"; tip.style.top=best.py+"px"; tip.textContent=`M${best.p.m} W${best.p.w} · ${best.p.wt} kg`; }
  };
  cv.onpointerleave=()=>{ $("#tip").style.display="none"; };
}

  v.querySelectorAll("[data-prstart]").forEach(b=>b.addEventListener("click",()=>prRun(b.dataset.prstart,false)));
  v.querySelectorAll("[data-prhide]").forEach(b=>b.addEventListener("click",()=>{ const P=presetById(b.dataset.prhide); confirmDlg(`Remove “${P.name}” from the preset list? Blocks already run from it, and any copies in Saved programmes, are not affected. You can bring it back with “Restore removed presets”.`,"Remove",()=>{ if(!state.hiddenPresets.includes(P.id)) state.hiddenPresets.push(P.id); save(); render(); }); }));
  const prr=v.querySelector("#prrestore"); if(prr) prr.addEventListener("click",()=>{ state.hiddenPresets=[]; save(); render(); toast("Presets restored"); });
  v.querySelectorAll("[data-predit]").forEach(b=>b.addEventListener("click",()=>{ const id=b.dataset.predit, P=presetById(id), sel=v.querySelector(`[data-prlen="${id}"]`); editFlow({id:"preset:"+P.id,name:P.name,plan:buildPreset(P),weeks:P.weeks},{weeks:sel?+sel.value:12}); }));
  v.querySelectorAll("[data-pgedit]").forEach(b=>b.addEventListener("click",()=>editFlow(state.programmes.find(x=>x.id===b.dataset.pgedit))));
  v.querySelectorAll("[data-prclone]").forEach(b=>b.addEventListener("click",()=>prRun(b.dataset.prclone,true)));
  const addE=v.querySelector("#addE"); if(addE) addE.addEventListener("click",()=>{ state.showE=true; state.planOpen="E"; save(); render(); });
  v.querySelectorAll("[data-pgstart]").forEach(b=>b.addEventListener("click",()=>{ const sel=v.querySelector(`[data-pglen="${b.dataset.pgstart}"]`); startFlow(state.programmes.find(x=>x.id===b.dataset.pgstart),{weeks:sel?+sel.value:12}); }));
  v.querySelectorAll("[data-pgdel]").forEach(b=>b.addEventListener("click",()=>{ const pg=state.programmes.find(x=>x.id===b.dataset.pgdel); confirmDlg(`Delete the saved programme “${pg.name}”? Blocks already run from it stay in your history.`,"Delete",()=>{ state.programmes=state.programmes.filter(x=>x.id!==pg.id); if(state.block.progId===pg.id) state.block.progId=""; save(); render(); }); }));
  v.querySelectorAll("[data-mr]").forEach(b=>b.addEventListener("click",()=>{ state.mapRange=b.dataset.mr; save(); render(); }));
  v.querySelectorAll("[data-pw]").forEach(b=>b.addEventListener("click",()=>{ state.pw=+b.dataset.pw; save(); render(); }));
  v.querySelectorAll("[data-blksave]").forEach(b=>b.addEventListener("click",()=>{ const bl=state.blocks.find(x=>x.id===b.dataset.blksave); promptDlg("Name this programme",bl.name,"Save",n=>{ saveProgramme(n,bl.plan,false,bl.weeks||12); render(); }); }));
  v.querySelectorAll("[data-blkdel]").forEach(b=>b.addEventListener("click",()=>{ const bl=state.blocks.find(x=>x.id===b.dataset.blkdel); confirmDlg(`Delete “${bl.name}” and its logs from your history? This can't be undone.`,"Delete",()=>{ state.blocks=state.blocks.filter(x=>x.id!==bl.id); save(); render(); }); }));
  v.querySelectorAll("details[data-lk]").forEach(d=>d.addEventListener("toggle",()=>{ state.libOpen[d.dataset.lk]=d.open; save(); }));
  v.querySelectorAll("[data-lrm]").forEach(b=>b.addEventListener("click",()=>{ const [k,i]=b.dataset.lrm.split("|"), name=state.library[k][+i]; confirmDlg(`Remove “${name}” from the library? Plans already using it keep their copy.`,"Remove",()=>{ state.library[k].splice(+i,1); save(); render(); }); }));
  const addEx=k=>{ const inp=v.querySelector(`[data-ladd-in="${CSS.escape(k)}"]`), val=inp.value.trim(); if(!val) return; if(!state.library[k].some(x=>normName(x)===normName(val))) state.library[k].push(val); state.libOpen["m:"+k]=true; save(); render(); toast("Added to "+k); };
  v.querySelectorAll("[data-ladd]").forEach(b=>b.addEventListener("click",()=>addEx(b.dataset.ladd)));
  v.querySelectorAll("[data-ladd-in]").forEach(inp=>inp.addEventListener("keydown",e=>{ if(e.key==="Enter") addEx(inp.dataset.laddIn); }));
}
function wire(){
  const v=$("#view");
  wireExtra(v);
  // segmented pickers
  v.querySelectorAll("[data-pick]").forEach(seg=>seg.addEventListener("click",e=>{
    const b=e.target.closest("button[data-v]"); if(!b) return;
    const k=seg.dataset.pick; state.pos[k]= k==="s"? b.dataset.v : +b.dataset.v; clampPos();
    entry=null; renderDock(); save(); render();
  }));
  if(state.tab==="train"){
    const {m,w,s}=state.pos;
    v.querySelectorAll("[data-jump]").forEach(b=>b.addEventListener("click",()=>{
      const [mm,ww]=b.dataset.jump.split("|"); state.pos.m=+mm; state.pos.w=+ww; entry=null; renderDock(); save(); render();
    }));
    v.querySelectorAll("[data-goplan]").forEach(b=>b.addEventListener("click",()=>{
      state.tab="plan"; state.planOpen=b.dataset.goplan; entry=null; renderDock(); save(); render();
    }));
    v.querySelectorAll("[data-cell]").forEach(b=>b.addEventListener("click",()=>{ const [slot,i,f]=b.dataset.cell.split("|"); openEntry(slot,+i,f); }));
    v.querySelectorAll("[data-check]").forEach(b=>b.addEventListener("click",()=>{ const [slot,i]=b.dataset.check.split("|"); toggleOk(slot,+i); }));
    v.querySelectorAll("[data-usesug]").forEach(b=>b.addEventListener("click",()=>{
      const slot=b.dataset.usesug, n=rxFor(s,m,w,slot).sets+((rowLog(m,w,s,slot,false)||{}).extra||0);
      for(let i=0;i<n;i++){ const x=setAt(m,w,s,slot,i,false); if(okSet(x)||(x&&x.w!==""&&x.w!=null)) continue; const sg=suggestW(m,w,s,slot,i); if(sg) setAt(m,w,s,slot,i,true).w=sg.v; }
      save(); rerender();
    }));
    v.querySelectorAll("[data-addset]").forEach(b=>b.addEventListener("click",()=>{ const rl=rowLog(m,w,s,b.dataset.addset,true); rl.extra=(rl.extra||0)+1; save(); rerender(); }));
    v.querySelectorAll("[data-rmset]").forEach(b=>b.addEventListener("click",()=>{
      const slot=b.dataset.rmset, rl=rowLog(m,w,s,slot,true);
      if((rl.extra||0)>0){ const idx=rxFor(s,m,w,slot).sets+rl.extra-1; if(rl.sets&&rl.sets.length>idx) rl.sets.length=idx; rl.extra--; }
      if(entry&&entry.slot===slot){ entry=null; renderDock(); }
      save(); rerender();
    }));
    v.querySelectorAll("[data-switch]").forEach(b=>b.addEventListener("click",()=>switchFlow(b.dataset.switch)));
    v.querySelectorAll("[data-rest]").forEach(sel=>sel.addEventListener("change",()=>{ slotPlan(s,m,sel.dataset.rest).rest=+sel.value; save(); }));
    v.querySelectorAll("[data-note]").forEach(inp=>inp.addEventListener("change",()=>{ rowLog(m,w,s,inp.dataset.note,true).note=inp.value; save(); }));
    v.querySelectorAll("[data-orm]").forEach(inp=>inp.addEventListener("change",()=>{
      const p=slotPlan(s,m,inp.dataset.orm), val=parseFloat(String(inp.value).replace(",","."));
      if(!state.block.orm) state.block.orm={};
      if(val>0) state.block.orm[normName(p.ex)]=val; else delete state.block.orm[normName(p.ex)];
      save(); rerender();
    }));
    const fin=v.querySelector("[data-finish]");
    if(fin) fin.addEventListener("click",()=>{
      const L=getLog(m,w,s,true);
      if(L.fin) delete L.fin; else { L.fin=Date.now(); if(!L.t0) L.t0=L.fin; if(!L.date) L.date=todayISO(); toast("Session finished"); }
      entry=null; renderDock(); save(); rerender();
    });
    const d=v.querySelector("[data-date]"); if(d) d.addEventListener("change",()=>{ getLog(m,w,s,true).date=d.value; save(); });
  }
  if(state.tab==="plan"){
    v.querySelectorAll("[data-pwoff]").forEach(b=>b.addEventListener("click",()=>{
      const [ss,mm,sid]=b.dataset.pwoff.split("|"), q=state.plan[ss][+mm][sid];
      const row=q.pw&&q.pw[0]; delete q.pw; delete q.pwCycle; delete q.bump; delete q.every;
      if(row){ q.sets=row.length; q.sr=row.map(x=>x.r.replace("+","")); q.reps=q.sr[0]; }
      save(); rerender();
    }));
    v.querySelectorAll("[data-acc]").forEach(b=>b.addEventListener("click",()=>{ state.planOpen=state.planOpen===b.dataset.acc?"":b.dataset.acc; save(); render(); }));
    v.querySelectorAll("[data-pmonth]").forEach(b=>b.addEventListener("click",()=>{ const [s,mth]=b.dataset.pmonth.split("|"); state.planMonth[s]=+mth; save(); render(); }));
    v.querySelectorAll("[data-grp]").forEach(sel=>sel.addEventListener("change",()=>{
      const [s,mth,slot]=sel.dataset.grp.split("|"); const p=state.plan[s][mth][slot];
      p.grp=sel.value;
      if(p.ex && p.grp && !(state.library[p.grp]||[]).includes(p.ex)) p.ex="";
      save(); render();
    }));
    v.querySelectorAll("[data-ex]").forEach(sel=>sel.addEventListener("change",()=>{ const [s,mth,slot]=sel.dataset.ex.split("|"); const p=state.plan[s][mth][slot]; p.ex=sel.value; if(p.ex && !p.grp) p.grp=findGroup(p.ex); save(); render(); }));
    v.querySelectorAll("[data-prog]").forEach(sel=>sel.addEventListener("change",()=>{ const [s,mth,slot]=sel.dataset.prog.split("|"); state.plan[s][mth][slot].prog=parseFloat(sel.value)||0; save(); }));
    v.querySelectorAll("[data-ssets]").forEach(sel=>sel.addEventListener("change",()=>{ const [s,mth,slot]=sel.dataset.ssets.split("|"); const p=state.plan[s][mth][slot]; const n0=parseInt(p.sets)||3, base=p.base||setReps(p,n0)[anchorIdx(p.style||"Straight sets",n0)]; delete p.setsBase; p.sets=sel.value===""?"":parseInt(sel.value); const n=parseInt(p.sets)||3; p.sr=(p.style&&p.style!=="Straight sets")?styleReps(p.style,base,n):setReps(p,n); p.reps=p.sr[0]; save(); render(); }));
    v.querySelectorAll("[data-srep]").forEach(inp=>inp.addEventListener("change",()=>{ const [s,mth,slot,i]=inp.dataset.srep.split("|"); const p=state.plan[s][mth][slot]; const n=parseInt(p.sets)||3; p.sr=setReps(p,n); const val=inp.value.trim().replace(/\s+/g,""); if(/\d/.test(val)){ p.sr[+i]=val; if(+i===anchorIdx(p.style||"Straight sets",n)) p.base=val; } else inp.value=p.sr[+i]; p.reps=p.sr[0]; p.tier=tierFromReps(p.base||p.reps); save(); }));
    v.querySelectorAll("[data-copy]").forEach(b=>b.addEventListener("click",()=>{
      const s=b.dataset.copy;
      for(const mth of [2,3]) state.plan[s][mth]=JSON.parse(JSON.stringify(state.plan[s][1]));
      save(); toast("Copied Session "+s+" plan to Months 2 & 3"); render();
    }));
    const cl=$("#c-load"), cr=$("#c-reps"), co=$("#c-out");
    const calc=()=>{ const l=parseFloat(cl.value), r=parseFloat(cr.value);
      co.textContent = l&&r ? Math.round(l*(1+r/30))+" kg" : "–"; };
    if(cl){ cl.addEventListener("input",calc); cr.addEventListener("input",calc); }
    const add=$("#addex");
    if(add) add.addEventListener("click",()=>{
      const name=$("#newex").value.trim(), cat=$("#newexcat").value;
      if(!name) return;
      if(!state.library[cat].includes(name)){ state.library[cat].push(name); state.library[cat].sort(); }
      save(); toast("Added "+name); render();
    });
  }
  if(state.tab==="prog"){
    const ts=$("#trendsel");
    if(ts) ts.addEventListener("change",()=>{ state.trendEx=ts.value; save(); render(); });
  }
  if(state.tab==="data"){
    const doMac=txt=>{ const r=Food.importLegacy(txt); if(r.err){ toast(r.err); return; } save(); $("#macbox").value=""; toast("Imported "+r.days+" days, "+r.w+" weigh-ins, "+r.m+" meals, "+r.f+" foods, "+r.b+" phases"); };
    $("#macimport").addEventListener("click",()=>doMac($("#macbox").value));
    $("#macfile").addEventListener("change",e=>{ const f=e.target.files[0]; if(!f) return; f.text().then(doMac); });
    $("#ormimport").addEventListener("click",()=>{
      const ALIAS={"squat":["Back Squat"],"romaniandeadlift":["Barbell Romanian Deadlift"],"bentoverrow":["Barbell Row"],"legpress":["Leg Press Low & Close","Leg Press High & Wide","Leg Press - Iron Records"],"overheadpress":["Overhead Press","Military Press"]};
      if(!state.block.orm) state.block.orm={}; let n=0;
      $("#ormbox").value.split(/\n/).forEach(line=>{ const m=line.trim().match(/^(.*?)[\s:=,\t]+(\d+(?:[.,]\d+)?)\s*(?:kg)?$/i); if(!m) return; const nm=m[1].trim(), kg=parseFloat(m[2].replace(",",".")); if(!nm||!(kg>0)) return;
        [nm].concat(ALIAS[normName(nm)]||[]).forEach(x=>{ state.block.orm[normName(x)]=kg; }); n++; });
      if(!n){ toast("Nothing recognised — use one line per exercise, like: Squat 106"); return; }
      $("#ormbox").value=""; save(); toast(n+" one rep maxes imported");
    });
    $("#setname").addEventListener("change",e=>{ state.name=e.target.value.trim(); save(); $("#who").textContent=state.name||"personal log"; });
    $("#copydata").addEventListener("click",async()=>{
      const json=JSON.stringify(state);
      try{ await navigator.clipboard.writeText(json); toast("Backup code copied — paste it on your other device"); }
      catch(e){ const box=$("#importbox"); box.value=json; box.select(); toast("Copy blocked — code shown below, select & copy it"); }
    });
    const dl=$("#dlfile");
    if(dl) dl.addEventListener("click",async()=>{
      try{
        const url=URL.createObjectURL(new Blob([JSON.stringify(state,null,1)],{type:"application/json"}));
        const a=document.createElement("a"); a.href=url; a.download="iron-records-log-backup-"+todayISO()+".json"; document.body.appendChild(a); a.click(); a.remove();
        setTimeout(()=>URL.revokeObjectURL(url),4000); toast("Backup file saved");
      }catch(e){ toast("Couldn't save the file — use the backup code instead"); }
    });
    $("#impfile").addEventListener("change",async e=>{
      const f=e.target.files[0]; if(!f) return;
      try{ $("#importbox").value=await f.text(); $("#doimport").click(); }catch(err){ toast("Couldn't read that file"); }
      e.target.value="";
    });
    $("#doimport").addEventListener("click",()=>{
      const raw=$("#importbox").value.trim(); if(!raw) return toast("Paste a backup code first");
      try{
        const obj=JSON.parse(raw);
        if(!obj||obj.v!==1||!obj.plan||!obj.logs) throw 0;
        state=Object.assign(defaults(),obj); migrate(); save(); toast("Imported — your log is up to date"); render();
      }catch(e){ toast("That doesn't look like a valid backup code"); }
    });
    $("#reset").addEventListener("click",()=>{
      confirmDlg("Erase ALL program data on this device? Export a backup first if you want to keep it.","Erase everything",()=>{ state=defaults(); entry=null; rest=null; renderDock(); paintRest(); save(); render(); });
    });
  }
}
window.addEventListener("resize",()=>{ if(state.tab==="prog") drawTrend(); });
try{
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>{ if(state.tab==="prog") drawTrend(); });
  new MutationObserver(()=>{ if(state.tab==="prog") drawTrend(); }).observe(document.documentElement,{attributes:true,attributeFilter:["data-theme"]});
}catch(e){}
initDock();
render();
initSync();
if("serviceWorker" in navigator) addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
if(navigator.storage&&navigator.storage.persist) navigator.storage.persist().catch(()=>{});
</script>
</body>
